version: "2"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yinweli/RovingDiner

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true # switch 帶 default 即視為窮舉（運算式 parser / evaluator 僅對相關 token 分派）
    dupl:
      threshold: 400
    dogsled:
      max-blank-identifiers: 4
    funlen:
      lines: 200
      statements: 150
    goconst:
      min-len: 2
      min-occurrences: 4
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - sloppyReassign
        - whyNoLint
        - wrapperFunc
      settings:
        hugeParam:
          sizeThreshold: 128
    gocyclo:
      min-complexity: 50
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
      ignored-functions:
        - strings.SplitN
        - strconv.FormatFloat
        - strconv.FormatInt
        - strconv.FormatUint
        - strconv.ParseFloat
        - strconv.ParseInt
        - strconv.ParseUint
    lll:
      line-length: 300
    misspell:
      locale: US
      ignore-rules:
        - dialogue
    nolintlint:
      allow-unused: false
      require-explanation: false
      require-specific: false
    staticcheck:
      checks: ["all", "-SA1019", "-ST1006", "-S1002", "-QF1012"]
    whitespace:
      multi-func: true
    wrapcheck:
      ignore-sigs:
        - fmt.Errorf( # wrapcheck 預設忽略清單成員（%w 即包裝慣用式）；本清單為覆蓋式設定，須自行補回
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-sig-regexps:
        - \.New.*Error\(
      ignore-package-globs:
        - encoding/*
        - github.com/pkg/*
        - golang.org/x/sync/singleflight
    gosec:
      excludes:
        - G101
        - G115
        - G117
        - G401
        - G404
        - G501
        - G502
        - G503
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    paths:
      - .idea
    rules:
      - text: 'QF1008: could remove embedded field "Option" from selector'
        linters:
          - staticcheck
      - text: 'declaration of "(err|ctx)" shadows declaration at'
        linters:
          - govet
      - text: G306
        linters:
          - gosec
      - text: "mnd: Magic number: 0644"
        linters:
          - mnd
      - path: (.+)_test.go
        linters:
          - mnd
          - dupl
          - funlen
          - goconst
      # 詞彙表的 map 鍵即名稱 SSOT（鍵與行為配對為單一定義點）：屬性讀寫表跨「全域／引用 × 值／鎖」、
      # 命令對象表（selector）與操作命令表（command）同名跨來源檔與測試重複是結構必然，非可抽常數的魔法字串。
      - path: internal/rules/(attr.*|selector|command.*)\.go
        linters:
          - goconst
      # 詞彙對照表（vocab.go）同理：map 鍵即詞條鍵，同名鍵跨全域／引用兩表（morale、score 等
      # 全域與顧客同名屬性）重複是結構必然，非可抽常數的魔法字串。
      - path: internal/cores/vocab\.go
        linters:
          - goconst
      # 場外（顧客池）與牌堆（卡牌堆）為同構三列面板：容器型別與識別碼工具不同（Guest／Card）、
      # 語意各自獨立演化，結構平行屬刻意設計，泛型合一得不償失（M26 R2／R4 確認）。
      - path: app/rodi/panel(Pool|Pile)\.go
        linters:
          - dupl
