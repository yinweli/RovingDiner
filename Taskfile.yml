version: "3"

tasks:
  # 程式碼格式化
  lint:
    ignore_error: true
    cmds:
      - golangci-lint fmt # 執行 gofmt + goimports
      - golangci-lint run --color always
      - python doc/build-md/normalize-md-tables.py # 正規化 doc 下所有 md 表格欄寬（CJK 對齊）
      - python doc/build-md/normalize-md-tables.py CLAUDE.md README.md # 正規化根層 md 表格欄寬（CJK 對齊）
      - npx markdownlint-cli --fix "*.md" "doc/*.md"
      - npx prettier --write --log-level warn --end-of-line lf '*.yml' '*.yaml' '**/*.yml' '**/*.yaml' || true

  # 文件輸出 HTML
  doc:
    cmds:
      - python doc/build-html/build.py # 由營業規格書.md 輸出 doc/營業規格書.html

  # 更新表格
  sheet:
    dir: gamedata
    cmds:
      - cmd: cmd /c build.bat
      - task: lint

  # 安裝工具
  install:
    ignore_error: true
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest # 安裝 lint
      - go install github.com/yinweli/Sheeter/v3/cmd/sheeter@latest # 安裝 sheeter
      - npm install -g markdownlint-cli # 安裝 markdown 格式化工具
      - npm install -g prettier # 安裝 yaml 格式化工具
