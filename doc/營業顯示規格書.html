<script type="text/markdown" id="md-src">

> 本文件記錄「以 Go + 終端機介面（TUI）實作營業系統**顯示／操作層**」的設計決策，作為**實作時的依據**。
> 主要讀者為負責實作的 AI；內容應可直接轉為實作規格。
> SSOT 為 `doc/營業規格書.md`，凡規則細節一律以該檔為準；專案架構與核心引擎見 `doc/營業實作規格書.md`，本文件只描述顯示／操作層，不重述規格規則與引擎架構。
> **引擎架構（yield-per-unit 事件流、單一 seeded PRNG、決定性）由實作規格書定義；本文件只描述顯示層如何「消費」該事件流。**
>
> §1–§8 為**已敲定設計**；§9 為實作里程碑。

## 1. 目標與定位

- 核心目標：**驗證 spec 可實作性** —— 確認 AI 能否依 `doc/營業規格書.md` 產出可運作、行為連貫的系統。
- UI 角色定位為 **debug viewer 而非 game UI**：
  - 預設大量曝露內部狀態（效果佇列、行動佇列、觸發時機、命令日誌、各容器即時內容）。
  - 重點曝露營業規格書【十九、核心流程】【二十、獨立流程】的流程順序 —— spec 最有驗證價值處。
  - 玩家輸入用鍵盤。

## 2. 技術選型

- **語言**：Go。
- **TUI 框架**：Bubble Tea + Lip Gloss + Bubbles。
  - Elm 架構（Model / Update / View），社群最大、AI 訓練語料最多。
  - 自訂互動流程能力強（目標選取暫停、步進），契合「驗證 AI 可實作性」的 meta 目標。
  - layout 用 Lip Gloss 手拼面板；可捲動的事件日誌用 Bubbles `viewport`。
  - 曾評估 tview（dashboard 排版更省事），但 meta 目標權重最高 → 選 Bubble Tea。

## 3. 事件流的消費：速率與步進

> 引擎架構本身（yield-per-unit 事件流、generator 風格、為何不同步跑完整 phase）由實作規格書 §一／§四定義。本節只描述**顯示層如何消費**這條事件流。

- 引擎每跑「一個單位」（一個命令 / 一次觸發 / 一次 phase 切換 / 一個玩家動作）吐一個事件；顯示層以三種速率消費**同一條事件流**，因此全部免費、不需各自實作：
  - 快速 = 快 timer 消費；慢速 = 慢 timer 消費；步進 = 停止自動消費、按 `[N]` 逐事件前進（即暫停態）。
  - `[Space]` 依 快速 → 慢速 → 步進 循環切換。
- 「步進顆粒度」因此收斂為**一拍 = 一個事件**：最細可停在單一命令、可凍結盤面逐命令檢視。
- 與右側事件日誌共用同一時間軸；除 phase 切換外，日誌的下一行即下一步。phase 切換仍是一個 yield 單位（步進會停、盤面 / 狀態列更新），但**不另立日誌行**，其階段值併入下一事件的範圍標題前綴（以 §6.10 為準）。
- **例外**：自動模式（快速 / 慢速）並非全自動 —— 遇「新選顧客 / 新選手牌」目標選取營業規格書【八、目標類型】時，引擎必須暫停等玩家輸入。

### 3.1 seed 顯示與決定性

> 決定性與單一 seeded PRNG 的定義見實作規格書 §一（鐵則 2）。本節只記顯示層相關行為。

- UI 於計數 modal 顯示當前 seed（§7.6.1）；啟動可用 flag 指定 seed。
- 效果：**同 seed + 同玩家輸入 = 同一局**，可在 TUI 上重現任何 bug。
- 事件日誌一併記錄玩家選取輸入（§6.10），供搭配 seed 重現；營業中不存檔、不重播（見實作規格書 §十），故不另建重播檔 schema。

## 4. 渲染政策：ASCII + CJK only

對齊風險只來自一類字元：**East Asian Ambiguous（歧義寬度）符號**（`★ ▣ ◆ ✦ ⚡ ▶ → ∞ ·` 等）與 **emoji**（`🔒` 等）—— 同一字元在不同終端機 / locale 下被當 1 格或 2 格，框線會歪。ASCII（半形 1 格）與 CJK 中文（全形 2 格）寬度在所有終端機一致，混排不會歪。

政策：

1. 內容只用 ASCII + CJK；禁用 emoji 與歧義寬度符號。
2. flag / 標記改用 ASCII 或短中文（寬度確定），對照見下表。
3. 一律交給 Lip Gloss 寬度感知 pad / truncate（內建 go-runewidth）；**禁止手動空格對齊**，每格設寬度預算、超出用 runewidth 截斷。
4. go-runewidth 設 ambiguous = narrow；因已不用歧義字元，此設定值不影響結果。
5. 例外：box-drawing 框線字元由 Lip Gloss 管理（各終端機實務上渲染為 1 格），不在禁用範圍。
6. **儲存格留白**：以 `|` 分隔的每格內容左右各留 1 空白（`| 內容 |`），不貼齊分隔線、不單邊留白；實際由 Lip Gloss cell padding = 1 產生。本文件所有示意圖（§6.1 草圖、各 modal mockup）一律照此繪製。

   ```
   X  |some data...|
   X  | some data...|
   X  |some data... |
   O  | some data... |
   ```

7. **標題留白**：嵌在框線的標題（modal 標題列、各群組 / 面板標題）前後各留 1 空白（`+- 標題 -...-+`），不貼齊框線字元。

   ```
   X  +-營業計數 (seed 1234567)---------------------+
   O  +- 營業計數 (seed 1234567) -------------------+
   ```

8. **欄距與欄寬（多欄並排）**：表格、橫向列表、modal 屬性多欄區一律 content-fit —— 每欄寬 = 該欄各列最大顯示寬（左對齊、短者右補空白），相鄰欄固定間隔 2 空白（每欄左右各 1 padding，承點 6）。
   - **跨群組 col2 對齊（modal 屬性區限定）**：modal 2 欄屬性區 col2 起點 = col1 最大寬 + 2，此最大寬取**整個 modal 屬性區（跨群組）**，使各群組 col2 對齊同一欄（較窄群組的 col1 後留白較多屬正常），不採等寬。
   - **主畫面不套跨群組對齊**：主畫面各面板**獨立 fit、面板間不對齊欄位** —— 座位用固定桌欄寬（§6.3）；行動 / 效果 / 手牌 / 場外 / 牌堆各自 content-fit 或序列排列，互不牽動。

   ```
   O  回合 3          回合上限 10
      士氣值 25[鎖2]  士氣值上限 30
   ```

| 概念         | 標記   |
|--------------|--------|
| 命中 / 是    | `v`    |
| 出牌點數保留 | `保`   |
| 永久         | `永`   |
| 空位         | `空`   |
| 對應箭頭     | `->`   |
| 命令結果     | `>>`   |
| 不棄         | `不棄` |
| 封印         | `封印` |
| 出牌後流放   | `出放` |
| 未出牌流放   | `未放` |

## 5. 顯示慣例：識別碼格式

卡牌 / 顧客 / 技能 / 效果一律使用同一識別碼模板：

```
資料編號@名稱#實例編號
```

- **資料編號**（`@` 前）：對應靜態資料編號（CardID / GuestID / SkillID / EffectID）；**恆顯**。
- **名稱**（`@` 後）：取自靜態資料的名稱欄；**恆顯**。
- **實例編號**（`#` 後）：執行期實例的 InstanceID，用以消歧同名實例；**無實例的實體（技能為靜態）省略整段 `#…`**。
- **sigil**：`@` = 資料編號、`#` = 實例編號，語意自描述。與營業規格書【二十三、屬性清單】鎖定 / 解鎖運算符 `@ #` 同形，但屬**顯示層**、與命令層分開（沿用 `#` 已借作實例編號的既有處置）。

**各層投影**（顯示模板的哪幾段）：

| 層         | 顯示                     | 例                               |
|:-----------|:-------------------------|:---------------------------------|
| 主畫面面板 | `資料編號@名稱`          | `10032@老饕`                     |
| 事件日誌   | `資料編號@名稱#實例編號` | `302@加耐#23`；技能 `30001@開朗` |
| 檢視 modal | `資料編號@名稱#實例編號` | `10032@老饕#12`                  |

- **主畫面省實例編號**：盤面位置本身已消歧同名實例、且省寬度，故主畫面只顯 `資料編號@名稱`（此為投影選擇，與技能「無實例」不同——技能在任何層都無 `#…` 段）。
- **空物件**（無目標 self 等）：無資料編號 / 名稱 / 實例，顯 `空`（特例，不套模板）。
- 依賴：靜態表格需有「名稱」欄（使用者自行於 SSOT 補上；本文件不處理）。

### 6.2 整體結構

畫面分左右兩欄：**左欄主畫面**由上而下堆疊 7 區，**右欄為常駐事件日誌**。主畫面 7 區由上而下為：

1. **座位**：在座顧客單條桌列
2. **場外**：排隊 → 遊蕩 → 卡牌化（不在座的顧客池）
3. **行動區**（行動佇列）
4. **效果區**（效果佇列）
5. **手牌**
6. **牌堆**（抽 / 棄 / 流放）
7. **狀態列**（全域屬性，置底）

右欄事件日誌與左欄同高，容納較多歷史行、便於展開觸發鏈，與步進共用同一時間軸。

下側另有一條**非聚焦**畫面元件：**鍵位列**（§6.11，常駐底部；選取模式併顯選取提示，不納入 §7.1 的 Tab 循環）。

### 6.3 區 1：座位

在座顧客 —— 單條桌列：

- 桌子排成水平 strip：`桌1 桌2 桌3 …`；**左右相鄰即鄰桌**（對應 NearSeatID），用 layout 把 spec 桌次拓樸畫出來。
- 桌數超過可視寬度時**橫向視窗捲動**（詳見 §6.12）。
- 每桌坐 2 位顧客，桌內 2 座位**上下疊**；空位顯示 `空`。
- 每位顧客內嵌摘要顯示為 **2 行**（用垂直換橫向、避免單桌過寬）：
  - 第 1 行：`GuestID@顧客名 飽{sate}耐{calm}`（識別碼依§5、主畫面省實例編號；只內嵌 `飽 / 耐`，驅動離場與門檻技能的「活」數值）。
  - 第 2 行（對齊到 `飽` 起始欄）：旗標列 `封 免 效`，命中才顯示、未命中該位留白、全空則整行留白。
- 旗標只回答「**有沒有被動過手腳**」，來源：
  - `封` ← 封印飽食技能 或 封印耐心技能 任一鎖定計數 > 0。
  - `免` ← 技能免疫群組 或 效果免疫群組 任一群組鎖定計數 > 0。
  - `效` ← 顧客身上有 active 效果。
- 詳情（封哪個 / 免哪些群組編號 / 效果內容、`滿意 / 士氣 / 飽食離場線 / 門檻命中 sateHit·calmHit / freeze`）→ 檢視 modal。
- 寬度上界：桌號 ≤ 2 位（`桌0`~`桌99`）、`飽` / `耐` 各 ≤ 3 位、識別碼 `GuestID@顧客名` = GuestID ≤ 5 位 + `@` 1 + 顧客名（≤ 4 中文 / 8 英文 = 8 格）= **14 格**。
- **桌欄固定寬** = 識別碼 14 + 空格 1 + `飽999耐999` 10 = **25 格**（旗標列 `封免效` ≤ 6 格，較窄不撐寬）。
- 各欄用**固定寬度**（不足補空白），位數 / 名長變動時欄位不左右跳動，`[左右]` 對齊的桌欄才不抖。

### 6.4 區 2：場外

不在座的顧客池，三列各占一行，顧客識別碼（依§5`GuestID@顧客名`、主畫面省實例編號）以空白分隔：

- **排隊列表**：FIFO，顧客名序列（隊頭在左）。
- **遊蕩列表**：顧客名集合（無序）。
- **卡牌化列表**：顧客名集合。
- 列過長超過可視寬度時**橫向視窗捲動**（詳見 §6.12）。
- 空列表（N=0）冒號後留空、不加佔位字（如 `卡牌化(0):`）。

### 6.5 區 3：行動區（行動佇列）

- FIFO、隊頭在左；每項為 **2 行**垂直區塊、橫向並排：
  - 第 1 行：`SkillID@技能名`（依§5，技能無實例段）。
  - 第 2 行：`GuestID@顧客名 飽/耐`。
- 超寬時**橫向視窗捲動**（詳見 §6.12）。

### 6.6 區 4：效果區（效果佇列）

- 依作用順序 RunOrder 排序；每項為 **2 行**垂直區塊、橫向並排：
  - 第 1 行：`EffectID@效果名xStack (N)`（如 `302@加耐x2 (3)`，識別碼依§5、主畫面省實例段）。層數為 1 → 省略 `xN`；N = 剩餘回合（Expire − 當前回合），永久（Expire=0）→ `(永)`。
  - 第 2 行：`self識別碼 類型`（如 `10032@老饕 觸發`，self 依§5`資料編號@名稱`）。self 無 → `空`；類型只有觸發 / 常駐（立即不入列）。
- 超寬時**橫向視窗捲動**（詳見 §6.12）。
- 其餘欄位（實例編號、Expire、觸發時機、觸發條件 / 次數、觸發後行為、各命令字串）→ 檢視 modal。

### 6.7 區 5：手牌

每張卡為一垂直區塊，**最多 3 行**（固定欄位、命中才顯示、否則留白，仿座位）；卡片橫向並排，超寬時**橫向視窗捲動**（詳見 §6.12）：

- 第 1 行：`CardID@卡牌名 (出牌點數)`（識別碼依§5、主畫面省實例段）；cardify 卡於名後加 `[GuestID@顧客名]`（即 `CardID@卡牌名[GuestID@顧客名] (出牌點數)`），標出 cardify 來源，非 cardify 卡無此段。
- 第 2 行：flag A —— `不棄`(Keep)｜`封印`(Seal)。
- 第 3 行：flag B —— `出放`(出牌後流放 PlayExile)｜`未放`(未出牌流放 UnplayExile)。
- `effect數` 等其餘欄位 → 檢視 modal；標記寬度見 §4。
- 出不起 / 封印的卡以暗色標記（出牌合法性提示）。

### 6.8 區 6：牌堆

仿場外，抽 / 棄 / 流放三堆各占一行、**常駐列出內容**（debug viewer，§1，攤開抽牌堆符合定位）：

- 格式 `抽牌堆(N): 卡牌識別碼序列`、`棄牌堆(N): …`、`流放堆(N): …`（識別碼依§5`CardID@卡牌名`、主畫面省實例段）；**堆頂在左**。
- 長堆超寬時**橫向視窗捲動**（詳見 §6.12）；`[Enter]` 檢視單張卡。

### 6.9 區 7：狀態列（置底，全域）

- **兩行對齊表**：第 1 行為各屬性**標籤**、第 2 行為對應**數值**，逐欄上下對齊；欄寬取「標籤 / 數值」較寬者。
- 欄位順序（左→右）：回合 `Round/RoundMax`、士氣 `Morale/MoraleMax`、護盾 `MoraleShield`、格擋 `MoraleBlock`（護盾 / 格擋為固定欄，`<= 0` 顯示 `0`）、出牌點數 `Energy/EnergyMax`（EnergyKeep 鎖定 → 值加 `保`）、滿意 `Score`；最右兩欄為環境欄 `階段` / `模式`（同其餘欄上標籤下數值）：`階段` 值為當前 phase（引擎踏站時才知當站、無持續存在的下一站狀態可投影，階段切換由本欄與日誌標題前綴呈現），`模式` 為 快速 / 慢速 / 步進。
- 士氣 / 護盾 / 格擋 / 滿意 為餐廳全域屬性（`餐廳士氣值` / `餐廳士氣值護盾` / `餐廳士氣值格擋` / `餐廳滿意值`，名詞列表）的寬度縮寫，非顧客同名屬性。
- 回合計數 / 最後 X / 累積多重集合（約 25 項）與 seed **不放狀態列**，收進計數 modal（§7.6.1）；開啟方式詳見 §7.3。

### 6.10 區 8（右）：事件日誌

時間序事件流，與步進同一時間軸（步進時下一條 = 下一步）。每行由「首字記號 / 縮排欄」決定角色；日誌欄寬有限（目標 30 欄，§8），不橫向捲動，超寬截斷、末端加 `>`，完整值改由該實例的檢視 modal 取得。識別碼一律依§5 識別碼格式（`資料編號@名稱#實例編號`）標示；資料編號前綴會多吃寬度，超寬時照截斷規則處理。

**座標**：回合與階段只放在範圍標題行 `[R{round} {階段}]`，其下各行沿用到下一個標題。階段用全名（營業開始 / 回合開始 / 玩家行動 / 顧客行動 / 回合結束 / 營業成功 / 營業失敗）；階段切換即標題前綴的階段值改變，不另立事件。

**行角色（首字即角色）**：

| 角色       | 首字 / 欄   | 寫法                       | 說明                                                                                         |
|:-----------|:------------|:---------------------------|:---------------------------------------------------------------------------------------------|
| 範圍標題   | `[`（欄 0） | `[R3 玩家行動] {事件}`     | 一個頂層事件起點                                                                             |
| 標題操作元 | `*`（欄 0） | `* 資料編號@名稱#實例編號` | 僅動作類事件用，依序為卡牌（或顧客）、技能，各一行；識別碼依§5，技能無實例編號故省 `#…` 段 |
| 效果       | `-`（欄 0） | `- 資料編號@名稱#實例編號` | 一個效果                                                                                     |
| 流程直屬行 | `$`（欄 0） | `$ 命令`                   | 由流程（非效果）發出                                                                         |
| 效果欄位   | 欄 2        | 對象 / 階段 / 命令         | 永遠隸屬上方最近的 `-`                                                                       |

欄 0 看首字分四種（`[ * - $`）；欄 2 一律為效果欄位，無需內容推斷行角色。

**顏色**：另依行角色 / 事件類別上色，與排版正交（取代以符號表意）。

**範圍事件**（標題的 `{事件}`，固定 4 字）：

| 類   | 事件名        | 操作元（`*`） |
|:-----|:--------------|:--------------|
| 動作 | `玩家出牌`    | 卡牌、技能    |
| 動作 | `顧客行動`    | 顧客、技能    |
| 動作 | `前置技能`    | 技能          |
| 時機 | `時機:時機名` | 無            |
| 流程 | `執行結算`    | 無            |
| 流程 | `手動結束`    | 無            |

時機名取自營業規格書【二十二、觸發時機清單】中文名。手牌超上限的棄牌為 `執行結算` 內的步驟（選取 + 流程命令），不另立事件。

範圍標題**有內容才立**（核心端保證，非顯示端過濾）：無命中效果的時機不立題（全數條件不成立仍立——條件不成立行是內容）；無事結算（終止判定不會中、門檻／離場／棄牌全無）不立題。

**效果欄位**（一行一欄、固定順序）：

1. **對象**（self）：依§5（`資料編號@名稱#實例編號`）；無目標顯 `空`（空欄亦佔一行，位置才穩）。
2. **階段**：`立即 / 加入 / 觸發 / 啟動 / 結束 / 條件不成立`（當前階段，非靜態效果類型；靜態類型見檢視 modal）。
3. **命令**：每執行一次一行（格式見下）。多命令 / 多次觸發 = 多條命令行。

**流程直屬行**（`$`）：無對象行、無階段行。內容為流程命令（格式見下）或選取紀錄（`$ 選取 …`，見下）。終止判定不立行——通過由其後的結算內容自證、命中由「結算空題＋緊接終局標題」表達（步驟註記除籍，M22 拍板）。

**命令行格式**（效果命令與流程命令共用，靠首 token 自辨）：

- 以 **屬性** 開頭：作用於上方 self（僅效果命令）。
- 以 **識別碼**（§5 格式 `資料編號@名稱#實例編號`）開頭：作用於該對象；命令對象與 self 不同時 fan-out、每對象一行。
- 全域屬性用全名（餐廳士氣值 / 餐廳滿意值 / 出牌點數 / 回合…）以別於 self 屬性。
- 格式：`<屬性> <運算> <值> >> <結果>`（屬性修改，營業規格書【十七、命令】；鎖定 / 解鎖無 `<值>` 段、結果為鎖定計數）或 `<識別碼> >> <去向>`（容器搬移；入座帶座位編號、顧客離場顯 離場）。
- 變體：行動入列 `<顧客> >> 行動佇列(飽食/耐心)`（出列不立行，緊接的顧客行動標題已承載）；變身 `<舊卡> >> <新卡>`（雙發配對成一行）；牌堆重整 `<牌堆> 洗牌`（全序不印，堆頂見區 6）；免疫 `<名稱>(群組) <運算> 1 >> <計數>`（查詢函式形）。（M22 拍板）
- 操作命令不另立操作名行：其結果由它造成的屬性 / 容器事件逐對象呈現（M22 拍板）。

**巢狀**：只縮一層（標題 / 效果於欄 0、效果欄位於欄 2）。更深的因果（命令觸發結算、結算觸發時機）不再內縮，改另起齊頭新標題，靠出現順序表因果。

**選取**：玩家選取以 `$ 選取 <來源> -> <選中 資料編號@名稱#實例編號…>` 記於生成效果之前，作為玩家輸入紀錄（搭配 seed 重現 bug，§3.1）；選取的「即時提示」仍在鍵位列（§6.11），本區只記「選取結果」。

* 1002@上菜#5
* 30001@開朗
$ 出牌點數 -= 2 >> 8
- 301@降飽#7
  10044@貴婦#5
  立即
  飽食 -= 2 >> 3
[R3 玩家行動] 時機:玩家出牌
- 302@加耐#23
  10032@老饕#3
  觸發

[R3 回合結束] 執行結算

$ 1001@招呼#9 >> 棄牌堆

### 6.11 鍵位列

- 常駐畫面最底、**固定 2 行**、橫跨底部全寬，列出當前模式全鍵（§7.5）；**內容隨模式切換**（常態 / 選取 / modal 態）。
- **非聚焦**畫面元件：不納入 §7.1 的 Tab 循環。
- 選取模式：行 1 為選取鍵位、行 2 為**選取提示**：
  - 提示格式 `<來源名> 要求選<對象>（已選 X/N）`，N = 目標數量上限。
    - `<對象>`：要選的種類（顧客 / 手牌 / 牌堆卡 / 效果…）。
    - `<來源名>`：發動此次選取的技能 / 效果 / 命令名稱。
- 各模式範例（鍵位順序見 §7.5）：

```
常態：
[Tab/Shift+Tab]切區 [Arrow]移動游標 [Enter]檢視 [F1]計數
[Space]快/慢/步進 [N]前進 [P]出牌 [E]結束 [Q]離開

選取：
[Tab/Shift+Tab]切區 [Arrow]移動游標 [Space]加選/取消 [Enter]確認
開朗 要求選顧客（已選 1/2）

modal 態：
[Up/Down]欄位捲動 [Esc]關閉
```

- 完整鍵表詳見 §7.5。

### 6.12 橫向視窗捲動（通用）

座位、場外三列、行動佇列、效果佇列、手牌、牌堆三堆，內容超過可視寬度時一律：

- **只渲染可見窗格**（桌窗格 / 列表項目 / 佇列 token / 卡片）。
- 游標 `[左右]` 移動時窗格跟著捲（cursor-follow）；各區 `[左右]` 語意見 §7.2。
- 兩端以 ASCII 截斷記號示意尚有未顯示項目，並**貼齊捲動區兩緣**：`<` 貼**左緣**（列表類緊接固定前綴標籤後，如 `抽牌堆(N): < …`）、`>` 貼**右緣**（右對齊、緊鄰面板右框前 1 格）。某端無更多項目則該端不顯記號、留空（如 `抽牌堆(N): … >`、`抽牌堆(N): < … >`）。

## 7. 互動規格

導覽分三層：**切區**（區間，§7.1）→ **游標移動**（區內項目，§7.2）；游標項目上有兩個動作——**檢視**（§7.3）與**選取**（§7.4）。常態下自由切區 / 移動 / 檢視；選取模式（引擎暫停）下切區與游標皆受限在候選間、動作改為選取。`[Enter]` 在檢視＝開 modal、在選取＝確認，靠當前模式區分。

### 7.1 切區移動

- `[Tab]`：在 **8 區** 間循環切換 —— 座位 / 場外 / 行動區 / 效果區 / 手牌 / 牌堆 / 狀態列 / 事件日誌（即 §6.2 區1–區7 + §6.10 區8）；聚焦區邊框高亮。鍵位列為非聚焦元件，不在循環內。
- 選取模式下 `[Tab]` 僅在「含候選的區」間切換。

### 7.2 游標移動

- 區內用 **方向鍵** 移游標；游標停駐的項目高亮（**游標態**），標示當前位置。方向鍵語意隨區調整：
  - **座位區**：左右換桌、上下切桌內 2 座。
  - **場外區**：上下在 排隊 / 遊蕩 / 卡牌化三列間移動、左右在該列內移動。
  - **行動區**：單列行動項目，左右在動作間移動。
  - **效果區**：單列效果項目，左右在效果間移動。
  - **手牌**：單列卡牌，左右在卡片間移動。
  - **牌堆區**：上下在 抽 / 棄 / 流放 三堆間移動、左右在該堆內移動。
  - **事件日誌**：上下捲動日誌（非逐項游標，移動 viewport 視窗）。
  - **狀態列無逐項游標**：聚焦即整列（動作見 §7.3）。
- 選取模式：同一套鍵，游標**只在候選間移動**、自動略過非候選。

### 7.3 檢視

- `[Enter]`：對游標項目開 **檢視 modal**（按 `[Esc]` 關閉），顯示該實例全部欄位（營業規格書【五、實例結構】實例 + 營業規格書【二十三、屬性清單】引用屬性）；牌堆項目為單張卡，檢視 modal 同手牌的卡牌欄位。
- **狀態列**：聚焦後 `[Enter]`、或專用快速鍵 `F1`，開計數 modal（§7.6.1），非逐項檢視。
- **摘要切線（貫穿全畫面）**：主畫面只放摘要欄位；完整欄位一律走 檢視 modal。顧客可讀屬性約 20 個、效果欄位約 18 個，主畫面塞不下。

### 7.4 選取

引擎暫停、要求玩家從候選中選取（目標顧客 / 出牌手牌 / 牌堆 / 效果 / 任何候選集）時進入此模式；就地在盤面上選、不另開清單 modal —— 候選已畫在各區、帶完整脈絡，重畫一份既重複又失位置感。移動沿用 §7.1 / §7.2（游標只在候選間）。

- **三種視覺態**（皆以該區可選單位為粒度——座位＝整個顧客格的完整 2 行、手牌 / 牌堆＝整張卡 token，不圈子片段）：
  - **候選態**：候選正常顯示、非候選**變暗（dim）**，區隔出可選範圍。
  - **游標態**：游標當前停駐的候選，強高亮（反白 / 加框）——與 §7.2 一致。
  - **已選態**：已加選的候選，選取色底（僅多選出現）。
- **選取提示**併入鍵位列（§6.11，僅選取模式顯示，格式 `<來源名> 要求選<對象>（已選 X/N）` 定義見 §6.11）；候選跨多區時各區的已選態高亮即可辨識分布，提示只示全域 `已選 X/N`。
- 候選 > N 才進入此模式（候選 ≤ N 時引擎依退化規則自動全選、不互動，營業規格書【九、目標數量】）；**不分單 / 多選，一律**：
  - `[Space]`：加選 / 取消選游標項目（toggle）；已選達 N 後再加選須先取消其一。
  - `[Enter]`：確認當前已選集合。
  - N=1 為「擇一」特例，同一套操作（選滿 1 個即可確認）。
- `[Space]` 於選取模式借用為加選——引擎已暫停，模式循環（快 / 慢 / 步進）此刻無意義。

兩條暫停路徑共用此模式：

- **目標類型**營業規格書【八、目標類型】：「新選顧客 / 新選手牌」暫停等選；「隨機 / 沿用 / 無目標」不互動。候選 > N 須選滿 N、候選 ≤ N 退化全選（營業規格書【九、目標數量】）；候選範圍詳見營業規格書【二十、獨立流程】。
- **命令對象 Pick**營業規格書【二十四、命令對象清單】：`guestPick` / `handPick` / `deckPick` / `dropPick` / `exilePick` 暫停等選；**不可取消、必須選出**，最多 N、候選 ≤ N 自動全選。（`guestWait` 暫停=否、取排隊前 N 位、不互動，不在此列）
- 顧客候選範圍：限座位列表、排除遊蕩 / 卡牌化、扣 skillImmune（詳見營業規格書【二十、獨立流程】）。

### 7.6 modal 內容與排版

§7.3 定義開啟行為，本節逐一定義各 modal「顯示哪些欄位、如何分組排版」。共 5 類：計數 / 顧客 / 行動 / 效果 / 卡牌（事件日誌無 modal，§7.2）。

通則：

- **尺寸上界 80 欄 × 22 行**（最大值、不得超過）、相對**整個畫面**置中；寬度可窄於 80、高度隨內容增長，達 22 行後溢出以 modal 態 `Up/Down` 捲動（§7.5）。
- **捲動標示**：內容超過 22 行而捲動時，於 modal **底部框線右下**嵌入位置指示（仿 `less`）—— 捲到底顯 `END`、其餘顯捲動百分比（如 `57%`，0% = 在頂）；純 ASCII（§4）。內容未溢出（無捲動）時不顯。

  ```
  some data...   |        some data...   |
  --------- 57% -+        --------- END -+
  ```

- **集合 / 列表為空**：區塊與表頭**恆顯**、僅資料列留空（各 modal 標「恆顯，通則」、不再重述比照對象）。
- **數值實例（值＋鎖）**：`寫鎖` 屬性顯 `值`，鎖定計數 > 0 時於值後緊接 `[鎖N]`（無空格、`鎖0` 不顯）；純鎖屬性（值恆 0）一律顯 `[鎖N]`（含 `[鎖0]`）。
- **儲存格留白**：每格內容左右各留 1 空白（`| 內容 |`），詳見 §4。

各 modal 的描述格式統一如下（後續 modal 比照）：

- **描述模板**：各節依序為 intro（對回哪個營業規格書【五、實例結構】實例 + 分群軸） → 欄位群組表（`| 群組 | 欄位（SSOT 英文） |`） → 排版示意 → mockup → 顯示規則。
- **標題列**：嵌入該實例 §5 識別碼（`資料編號@名稱#實例編號`）或關鍵狀態（如計數 seed）；內文不再另列識別欄。
- **靜態 def 納入**：營業規格書【五、實例結構】實例欄不足以 debug 時，補入對應靜態 def（顧客 / 行動 / 效果 modal 已採）。
- **屬性 2 欄對齊**：屬性區 col1 = 值/primary、col2 = 上限/secondary（同 col 各列上下對齊）；無配對的單身屬性佔整列、col2 留空；物件 / 運算式等長值各吃整列。單欄逐列為偏離（行動 modal）。
- **modal 寬 / 欄距**：寬由最寬列決定；欄距 / 欄寬依 §4。

#### 7.6.1 計數 modal

顯示規則：

- **階段**：當 `NextPhase` 非空時顯 `當前階段 > NextPhase`，否則只顯當前階段。
- **最後對象**：皆為引用，依§5顯 `資料編號@名稱#實例編號`；附帶資訊（離場座位 / 行動技能 / 變身前→後 CardID）一律以 `(...)` 接於識別碼後（如 `10032@老饕#3 (桌2)`、`10044@貴婦#5 (30002@結帳)`、`10045@茶#4 (10032->10045)`）；附帶資訊中若為實體（如行動技能）亦套§5，座位 / CardID 等非實體值照原樣；尚無此項目（空引用）→ 該欄空著（不畫記號）。
- **次數 / 張數**：次數 = 當回計數、回合開始歸零；張數 = 自營業開始總量（按 `cardGroup` 分組）、營業開始清零。
- **歷史計數(按組)**：另以樞紐表呈現 —— 列為群組、欄為抽 / 棄 / 出 / 流放（`DrawTotal` / `DropTotal` / `PlayTotal` / `ExileTotal`），格為該組張數；欄數固定（不橫向溢出），群組多則往下長、隨 modal 縱向捲動；無群組（營業初）仍顯區塊與表頭（恆顯，比照顧客 modal）。
- **樞紐表僅 4 種卡牌動作**（抽 / 棄 / 出 / 流放）；入座 / 離場 / 行動 / 變身 無歷史計數、不列入。

## 8. 終端機尺寸與 flex

- 行數由視窗大小決定，非固定值；執行時靠 Bubble Tea `WindowSizeMsg` 取得實際 `行×列`，layout 依此 flex，**不寫死**。
- 行數參考：經典下限 `80×24`、Windows Terminal 預設約 `120×30`、1080p 最大化約 50–60 行、1440p/4K 約 70–90+。
- 欄數實測參考：Claude Code 當前顯示一行約 **104 半形欄**（貼近下限）。據此 layout 以 ~100 欄為主要設計寬度再向上 flex：**左欄主畫面壓 ~70 欄、右側事件日誌 ~30 欄**，才能在此寬度下不被截斷。
- 本 layout 行數預算（最小可用 ≈ 30）：座位 5（桌號列 1 + 桌內 2 座各 2 行）+ 場外 3（排隊 / 遊蕩 / 卡牌化各 1）+ 行動區 2 + 效果區 2 + 手牌 3（卡名 1 + flag 2；cardify 來源併入卡名行）+ 牌堆 3（抽 / 棄 / 流放各 1）+ 狀態列 2 + 框線 8 + 鍵位列 2（固定 2 行、橫跨全寬）。事件日誌在右側、與左欄同高，不另吃行數。
- **最低支援尺寸 `100×30`**；低於它顯示「請放大終端機」提示，不硬塞。
- flex / scroll 分配：固定面板（狀態列、手牌、佇列摘要行）**優先保證顯示**；會變長的面板（效果佇列、事件日誌、牌堆展開）吃剩餘行數並 **scroll**。
- **§5 識別碼寬度影響**：全畫面統一識別碼後（§5），主畫面 token 前綴 `資料編號@`（≤ 6 格）、桌欄寬 19 → 25（§6.3），手牌 cardify 卡更達 `CardID@卡牌名[GuestID@顧客名] (n)`。~100 欄設計寬下，座位一列可視 2 桌（§6.1）、其餘桌 / 卡 / 佇列項以 §6.12 橫向捲動取得，終端機更寬時 flex 顯更多。行數預算（上）不受識別碼寬度影響、維持不變。

## 9. 實作里程碑

核心引擎里程碑（M0–M4）見實作規格書 §九；顯示層在核心可用測試腳本跑完整一局後才疊上：

1. **引擎骨架優先**：先依實作規格書 + SSOT 產出引擎骨架（事件流 + 命令解析 + 結算），不接 UI、用最小 harness 驗證流程順序 —— 這是「AI 能否實作 spec」最直接的測試。
2. 接 Bubble Tea UI（依 §6 畫面規格、§7 互動規格）。

<script>
(function () {
    // ----- 1) 渲染 markdown -----
    const src = document.getElementById('md-src').textContent.trim();
    const content = document.getElementById('content');
    content.innerHTML = marked.parse(src);

    // ----- 2) 為 h2 / h3 補錨點 id -----
    function slugify(text) {
        return text.trim()
            .replace(/\s+/g, '-')
            .replace(/[（）()\[\]【】，,。.、:：;；／/]/g, '')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '');
    }
    const heads = Array.prototype.slice.call(content.querySelectorAll('h2, h3'));
    const used = {};
    heads.forEach(function (h) {
        let id = slugify(h.textContent) || 'h';
        let finalId = id, i = 1;
        while (used[finalId] || document.getElementById(finalId)) {
            finalId = id + '-' + (++i);
        }
        used[finalId] = 1;
        h.id = finalId;
    });

    // ----- 3) 由標題生成左側目錄（沿用 .nav-group 樣式） -----
    const toc = document.getElementById('toc');
    const group = document.createElement('div');
    group.className = 'nav-group';
    const title = document.createElement('div');
    title.className = 'nav-group-title';
    title.textContent = '章節';
    group.appendChild(title);
    heads.forEach(function (h) {
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.setAttribute('data-target', h.id);
        a.textContent = h.textContent.trim();
        if (h.tagName === 'H3') {
            a.className = 'sub';
        } // if
        group.appendChild(a);
    });
    toc.appendChild(group);

    // ----- 4) scroll-spy：高亮當前章節 -----
    const links = Array.prototype.slice.call(toc.querySelectorAll('a'));
    const byId = {};
    links.forEach(function (a) { byId[a.getAttribute('data-target')] = a; });

    function onScroll() {
        let current = null, bestY = -Infinity;
        heads.forEach(function (h) {
            const y = h.getBoundingClientRect().top;
            if (y <= 120 && y > bestY) {
                bestY = y;
                current = h;
            } // if
        });
        links.forEach(function (a) { a.classList.remove('active'); });
        if (current && byId[current.id]) {
            byId[current.id].classList.add('active');
        } // if
    }
    document.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
})();
</script>
</body>
</html>
