## 一、設計總綱

三個需求（核心與顯示解耦、完整單元測試、測試資料做法）指向同一核心決策：
**營業核心是一個純邏輯、單執行緒、決定性（deterministic）的狀態機，所有對外的東西都走邊界介面**。
守住這條線，核心與顯示解耦、單元測試、測試資料三件事會同時變簡單。

四條鐵則：

1. **核心零 I/O、零框架依賴**：營業核心（`cores`／`rules`／`games`）不 import Bubble Tea、不碰終端機、不開 goroutine、不碰全域時間/亂數。只依賴介面。
2. **決定性**：同 `seed` + 同玩家輸入 = 同一局。所有隨機來源（洗牌、隨機顧客／手牌、額外發動次數區間、抽獎）共用單一注入的 `Rander`（seeded PRNG），是回歸測試與 bug 重現的基礎（顯示層如何顯示 seed 見顯示規格書 §3.1）。
3. **yield-per-unit 事件流**：核心每跑「一個單位」（一個命令／一次觸發／一次 phase 切換／一個玩家動作）就吐一個事件。快速／慢速／步進只是同一條事件流的不同消費速率（消費端設計見顯示規格書 §3）。
4. **單一真相 + 單向投影**：引擎是唯一真相，持有全部 instance 與容器（純可序列化資料、零顯示依賴）；前端（TUI）是純投影，靠事件流 + `InstanceID` 對照表更新畫面，**不持有規則狀態的第二份拷貝**。詳見第四節之二。

## 二、套件結構

沿用 DiceBattle-server 的命名直覺（`this` receiver、`sheet` 既有；基礎設施層改名為 `infra`），
但因為是純規則引擎、無 DB／網路，砍掉 `apis`／`querys`／`modules`，改以演算法子系統分包。
核心採**引擎本體 + 詞彙層 + 對外介面**分層：`cores` 為營業引擎本體（資料模型 + 驅動引擎 `Game`，單向 import `exprs`），
`rules` 為命令語言詞彙層（屬性讀寫／操作命令／命令對象／內建函式的詞彙表與行為 + 效果流程，單向 import `cores`／`exprs`），
`games` 為對外介面層（`Parse`／`Validate`／`Run`，單向 import `rules`／`cores`／`exprs`）；
依賴呈 `games → rules → cores → exprs` 單一直線；運算式對遊戲值的回呼經 `exprs.Resolver` 介面反轉（`cores.Game` 實作、`exprs` 反向不依賴），全鏈無環。
詞彙以 `rules` 的套件層 map 字面值為單一定義點，建構 `Game` 後經 `rules.Register` 一次裝備進其私有詞彙表（裝備後唯讀、等同常數）。

```text
RovingDiner/
├─ cmd/                       瘦進入點：flag 解析 + 組裝後呼叫 app
│  ├─ tui/                  TUI main.go（seed、replay 檔）
│  └─ check/                企劃驗證器 main.go
├─ app/                       應用本體（消費同一核心）
│  ├─ tui/                  Bubble Tea Model/Update/View + engine adapter
│  └─ check/                企劃驗證器實作（CLI＋Effect 表掃描器）
├─ internal/
│  ├─ infra/                sheet 載入（組裝 *sheeter.Sheeter）、PRNG 來源——Go-only 基礎設施
│  ├─ exprs/                運算式引擎：lexer → parser → AST → evaluator；game-agnostic、可單獨測
│  │                        條件對象走 Resolver 介面、內建函式經 Env 於求值期帶入
│  ├─ cores/                營業引擎本體（單向 import exprs、不 import rules／games），依關注點分檔：
│  │   ├─ define.go         三 port（Operator／Presenter／Rander）+ Compiler／EffectExec、EventData、
│  │   │                    資料模型列舉、詞彙行為簽名（AttrReadFunc 等七型）
│  │   ├─ value.go          Value 雙欄原語（value+lock；Apply 賦值符分派／Clamp 夾制）
│  │   ├─ help.go           集合原語：Immune／Hit／IDList／Tally
│  │   ├─ ref.go            實例 ↔ exprs.Ref 橋接（cardRef／guestRef；AsCard／AsGuest）
│  │   ├─ card.go …         實例 + 容器，每型別一檔（card／guest／effect／action.go；
│  │   │                    CardList／WaitList／SeatList／GuestList／EffectList／ActionList）
│  │   ├─ data.go           遊戲資料聚合 Data：原始表 + 衍生索引（抽獎分組、效果預編譯；Compiler 由 games 注入）；
│  │   │                    存取門 GetSheet／GetAward／GetEffect／SetEffect
│  │   └─ game.go           Game＝一場營業的聚合狀態 + 驅動引擎：委派實作 exprs.Resolver、
│  │                        ExecAssign／ExecOperate／LocateCard／LocateGuest／Env／Register*；詞彙表為私有成員
│  ├─ rules/                命令語言詞彙層（單向 import cores／exprs、不 import games）；map 字面值＝詞彙 SSOT：
│  │   ├─ register.go       Register(game)：全部詞彙逐詞條裝備進 Game
│  │   ├─ attr*.go          全域／引用屬性讀寫：attrRead／attrWrite／attrRefRead／attrRefWrite 詞彙表 + 行為
│  │   │                    （含查詢函式；HasAttrWrite／HasAttrRefWrite 供 Validate 查名）
│  │   ├─ command*.go       操作命令：command 詞彙表（command.go）+ verb 行為依類別分檔
│  │   │                    （commandMove／Card／Effect／Guest／Instance／Flow.go）；HasCommand 供 Validate 查名
│  │   ├─ selector.go       命令對象：詞彙表 + 解析行為（~35 條；N 邊界／退化／filter／deckTop auto-shuffle）；
│  │   │                    HasSelector 供 Validate 查名
│  │   ├─ builtin.go        內建函式註冊表（min／max）
│  │   ├─ effect*.go        效果流程：堆疊處理（effectStack）／啟動效果列表（effectStart）／觸發派發（effectTrigger）
│  │   │                    ／推進（effectAdvance）／清理（effectCleanup）
│  │   └─ help.go           跨概念共用 helper：參數取值／分組計數／引用鎖定取值／卡牌容器原語／士氣扣減特例
│  ├─ games/                對外介面層（單向 import rules／cores／exprs），依關注點分檔：
│  │   ├─ parse.go          命令文法 parser + Command AST（純文法、名稱原始字串；對外入口 Parse）
│  │   ├─ validate.go       命令 AST 名稱驗證：自由 Validate 逐名查 rules 詞彙表（Has* 四查詢）
│  │   ├─ execute.go        走法 X 薄派發：AST 型別 switch → Game.ExecAssign／ExecOperate
│  │   └─ run.go            （M14+ 未建）營業執行對外入口 Run：NewGame + rules.Register 後推進核心流程、逐單位 Emit
│  └─ tester/               跨包共用測試基建：BuildSheet／BuildData 迷你資料、FakeOperator／FakeRander 決定性替身
│                           （cores 白箱測試不能 import tester——成環，自持私有複本）
├─ sheet/ sheetdata/ gamedata/    （已存在，沿用既有 Sheeter pipeline）
```

- `cmd/` 保持瘦（只有 main + flag + 組裝）；應用本體放 `app/{tui,check}`，所以 `cmd` 不會肥。此分法對齊 DiceBattle-server（`cmd/` 瘦進入點、`app/` 應用本體）。
- 命令（verb）與命令對象（作用對象解析）分屬 rules 的 `command.go` 與 `selector.go`：兩者執行時雖一起出現，但屬不同關注點。**命令對象刻意不叫 `target`**，以免與 營業規格書【八、目標類型】的「目標類型(TargetKind)」撞名。
  - 命名定為 `selector`（非保留字，可同時當檔名與識別碼 `Selector` / `selectorGuest`）。語意是「用篩／抽／查／切各種方式產出作用對象集合」，比 `filter` 廣（`filter` 已是 營業規格書【二十四、命令對象清單】命令對象內部「卡牌編號篩選」的子術語，且 `deckTop` 會 mutate，不符 filter 唯讀語意）。

**為什麼這樣拆 `cores` + `rules` + `games`（引擎本體 + 詞彙層 + 對外介面）**：`cores` 收齊營業引擎本體（資料模型 + 驅動引擎 `Game`），
`rules` 收齊命令語言的規則內容（詞彙表與行為 + 效果流程），`games` 只留對外函式（`Parse`／`Validate`／`Run`）。
用 Go 的 acyclic import 把依賴壓成 `games → rules → cores → exprs` 一條直線——
讀 `games` 即知對外能做什麼；規則內容都在 `rules`，每詞條一個吃 `game *cores.Game` 的具名自由函式，只經 `cores` 公開面（`Get*`／`Locate*`／容器方法）操作狀態；
引擎機制（分派、狀態、原語）都在 `cores`，不 import `rules`／`games`、永不反向依賴詞彙與對外層。
詞彙表為 `Game` 私有成員（裝備制）：`rules` 的 map 字面值是單一定義點，`rules.Register` 於建構後一次裝備、裝備後唯讀。
`exprs` 維持獨立第四包，因為它是零遊戲依賴的運算式語言、可單獨測；其對遊戲值的回呼經 `exprs.Resolver` 介面反轉、由 `cores.Game` 實作。

**`exprs` 的解耦**：`exprs` 只懂語法與運算，遇到「條件對象」（`morale`、`self.calm`、`drawLast.cardID`、
`tableCount('>=',2)`…）時呼叫一個 `Resolver` 介面取值，內建函式（`min`／`max`…）亦由外部注入。
`cores.Game` 委派實作 `Resolver`（讀寫行為由 `rules` 的 `attr*.go` 詞條裝備）、內建函式由 `rules`（`builtin.go`）裝備進 `Game`、求值期經 `Game.Env()` 帶入，把營業規格書【二十三、屬性清單】【二十六、內建函式清單】的綁定塞進去。
這樣 `exprs` 零遊戲依賴，且能脫離遊戲跑語法／運算測試。

## 三、核心引擎的內部分層

由內而外、依賴單向（package 歸屬：運算式在 `exprs/`；狀態與驅動引擎在 `cores/`；屬性／命令／命令對象／效果 的詞彙與行為在 `rules/`；對外的 `Parse`／`Validate`／`Run` 收於 `games/`，effect 的觸發／堆疊／啟動／推進／清理 orchestration 即 `rules/effect*.go`）：

| 層       | 檔案                                                             | 職責                                                                                                                                                                             | 對應 spec                                                     |
|:---------|:-----------------------------------------------------------------|:---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|:--------------------------------------------------------------|
| 狀態     | `cores/`：value／help／ref／card／guest／effect／action／game.go | Value/Card/Guest/Effect/Action 實例與 10 個容器、`Game` 聚合狀態；`Value` 帶 `Value+Lock`（鎖定計數）統一語意                                                                    | 營業規格書【五、實例結構】【六、容器結構】                    |
| 運算式   | `exprs/`                                                         | 完整運算式（算術+比較+邏輯+三元）、四捨五入 half-away-from-zero、評估失敗回傳狀態                                                                                                | 營業規格書【二十七、運算式】【二十六、內建函式清單】          |
| 屬性     | `rules/attr*.go`                                                 | 全域屬性／卡牌引用／顧客引用／查詢函式 的讀寫行為（attrRead／attrWrite／attrRefRead／attrRefWrite 詞彙表，裝備進 `Game`）；餐廳士氣值 `-=` 特例                                  | 營業規格書【二十三、屬性清單】【十七、命令｜1. 屬性修改命令】 |
| 命令     | `rules/command*.go`                                              | 屬性修改 + ~60 操作命令 verb 執行行為（command 詞彙表 + commandMove／Card／Effect／Guest／Instance／Flow.go）；命令文法 parser／名稱驗證屬 games 對外層（parse.go／validate.go） | 營業規格書【十七、命令】【二十五、操作命令清單】              |
| 命令對象 | `rules/selector.go`                                              | ~35 命令對象解析行為（作用對象集合；含 N 邊界／退化／filter／deckTop auto-shuffle）                                                                                              | 營業規格書【二十四、命令對象清單】                            |
| 效果     | `rules/effect*.go`                                               | 堆疊處理（effectStack）／啟動效果列表（effectStart）／觸發派發（effectTrigger）／推進（effectAdvance）／清理（effectCleanup）＋ 免疫與凍結閘門；佇列操作原語歸 `cores/effect.go` | 營業規格書【七、效果類型】【十~十六】【二十、獨立流程】       |
| 流程     | （M14–M16，屆時歸位）                                           | 6 個 phase 狀態機 + 啟動技能 + 執行結算 + 終止判定 + 結算旗標重入防護                                                                                                            | 營業規格書【十九、核心流程】【二十、獨立流程】                |

三個易混的「解析對象」概念，分屬不同層、不同時機，務必分清：

| 概念                  | 是什麼                                                   | 時機                    | 放哪                   |
|:----------------------|:---------------------------------------------------------|:------------------------|:-----------------------|
| 命令（verb）          | ~60 操作命令 + 屬性修改                                  | 執行命令時              | `rules/command*.go`    |
| **命令對象解析**      | `guestPick`／`deckTop`／`handAll`… 解析「這次作用到誰」 | 執行命令時（第 1 參數） | `rules/selector.go`    |
| 目標類型（self 綁定） | 新選／沿用／隨機 顧客／手牌                              | 效果建立時（啟動技能）  | `rules/effectStart.go` |

會咬到設計的細節：

- **`Value` 雙欄模型**：所有可變屬性都是 `{Value, Lock}`。`@`／`#` 改 `Lock`，帶值賦值在 `Lock>0` 時 no-op。
  做成共用型別，否則 60 個命令會各寫各的。
- **結算重入**：`執行命令` 後若 `結算旗標==false` 會呼叫 `執行結算`，而結算又會觸發時機 → 跑命令。
  `結算旗標` 必須是 runtime 狀態、且流程要能安全重入。
- **暫停點**：玩家行動主迴圈、目標選取（新選顧客／手牌）、命令對象 `*Pick`、手牌上限棄牌——
  全部收斂成對 `Operator` 介面的同步呼叫，核心不需要知道對方是 TUI 還是測試腳本。

## 四、解耦的關鍵：邊界介面

核心只認三個**行為**介面（`Operator`／`Presenter`／`Rander`，定義於 `cores/define.go`），TUI 與測試各自提供實作。**靜態表格不走介面**：
Sheeter 生成的 `*sheeter.Sheeter` 本身就是核心的靜態資料 port，
核心經 `GetSheet()` 直接以 `sheet.Card.Get(id)` 查詢；衍生索引（抽獎依群組聚合、效果命令預編譯）由核心於 `NewData` 預建一次（`cores/data.go` 的 `Data` 聚合；效果命令編譯經 `Compiler` 由 games 注入）。

> 為何不用 `Dater` 介面包一層：核心回傳型別本就是 `*sheeter.Card` 等生成型別，介面並未真正隔離生成碼，
> 反而每新增一張表就要改一次介面，是 churn 來源。直接用 `Sheeter` 的 `reader.Get(key)`（查無回 nil）即可；衍生邏輯（Award 聚合等）移入核心。

```go
// Rander：唯一亂數來源（單一 seeded PRNG）
type Rander interface {
    Intn(n int) int
    Shuffle(n int, swap func(i, j int))
    Weighted(weight []int32) int          // 抽獎 weighted random
}

// Operator：玩家輸入（所有「暫停流程」點）
type Operator interface {
    PlayerAction(game *Game) Action      // 出牌 X / 結束
    PickGuest(source []*Guest, count int) []*Guest   // 新選顧客 / guestPick / nearPick / samePick
    PickCard(source []*Card, count int) []*Card      // 新選手牌 / *Pick 牌堆類
    PickDiscard(source []*Card, over int) []*Card    // 手牌上限棄牌
}

// Presenter：事件流輸出（yield-per-unit；步進時可阻塞）
type Presenter interface {
    Emit(eventData EventData)   // 一個命令／一次觸發／一次 phase 切換／一個玩家動作 = 一個 EventData
}
```

**核心怎麼跑**：`games.Run`（M14+）內部以 `cores.NewGame(seed, data, operator, rander)` 建營業實例（`data` 為 `cores.NewData(sheet, compiler)` 聚合）、`rules.Register` 裝備詞彙後，推進 營業規格書【十九、核心流程】【二十、獨立流程】的同步流程。
需要玩家輸入時 call `operator.PickXxx(...)` 並阻塞等回傳；每跑一個單位 call `presenter.Emit(...)`。
**核心本身完全同步、單執行緒、無 channel。**

**TUI adapter（Go-only）**：在背景 goroutine 跑 `games.Run`，用 channel 把 `Operator`／`Presenter` 的呼叫橋接到
Bubble Tea 的 Elm loop。步進＝`Presenter.Emit` 在 channel 上阻塞，等使用者按 `[N]` 才放行。
**goroutine + channel 只活在 adapter，核心碰不到**——核心因此維持同步、單執行緒，可被 scripted `Operator` 直接測試。

### 四之二、狀態歸屬與前端投影

**問題**：若 instance／容器由前端持有，前端就要同步「規則資料」與「畫面物件」兩份東西，很難維護。

**根因**：難點不在「核心持有資料」，而在「資料雙向同步」。先把兩種狀態拆開：

- **規則狀態（rules-state）**：`sate`／`calm`／鎖定計數／實例效果列表／所在容器／`InstanceID`…… 引擎每個 tick 狂讀狂寫。
- **顯示狀態（view-state）**：畫面物件的版面位置／樣式／高亮／游標／動畫…… 前端的東西。

耦合只在「instance↔View 互持參考」或「兩邊都能改同一份資料」時才發生。用穩定的 `InstanceID`（營業規格書【五、實例結構】各實例本就有）連結，耦合即不存在。

**做法：單一真相 + 單向事件投影**（不採「前端實作佇列」）：

```text
引擎（唯一真相）──事件流──▶ 前端（純投影）
  持有 instance + 容器           Map<InstanceID, View>
  每跑一個單位 Emit 細粒度事件     收事件 → 建立／移動／更新／銷毀 View
```

- 事件夠細：`卡牌 1234 抽牌牌堆→手牌`、`顧客 5678 sate 30→18`、`效果 9001 入佇列`、`卡牌 1234 銷毀`。
- 前端**只**維護 `InstanceID → View` 對照，收事件改畫面；**不持有規則狀態的第二份拷貝** → 只有一份真相、單向流動 → 「同步兩份資料」的痛點消失。
- **前端只認同一條 `Presenter` 事件流**：一套設計可餵任何前端（目前為 TUI）。
- 為什麼不採「前端實作佇列」：引擎每 tick 要讀寫大量實例屬性，若佇列／實例由前端經介面持有，邊界會極度 chatty，且把規則狀態漏進前端層（規則／顯示混淆）；它解決的「資料重複」對本遊戲資料量根本不是問題。

**投影事件分類（`EventData` 設計草案）**：

| 類別      | 例                                           | 前端反應                                             |
|:----------|:---------------------------------------------|:-----------------------------------------------------|
| instance  | 實例 建立／銷毀（卡牌／顧客／效果）          | 生成／回收 View                                      |
| container | 卡牌移動牌堆、顧客入座／離場／遊蕩／卡牌化   | View 換容器、播移動動畫                              |
| property  | `sate`／`calm`／`score`／鎖定計數 變化       | 更新數字、播受擊／加值表演                           |
| trigger   | 觸發時機到達、某效果觸發                     | 高亮來源、播效果表演（營業規格書【十八、表演資訊】） |
| phase     | phase 切換（不另立日誌行，併入下一事件前綴） | 更新狀態列                                           |

> 選項（暫不採）：核心對容器存取走 `Container[T]` 介面、**預設 in-core 實作**，保留未來讓外部接管儲存的seam。預設關閉，因為事件投影已達成解耦。

## 五、顯示／操作層（TUI，Go-only）

`app/tui`（本體）+ `cmd/tui`（瘦進入點），Bubble Tea + Lip Gloss + Bubbles，照顯示規格書 §4~§7。只做三件事：

核心吐的 `EventData` 要自帶表演資訊與目標（營業規格書【十八、表演資訊】），TUI 才能在正確目標上表演，而核心不需要知道任何畫面細節。

沿用既有 `sheeter` pipeline，不動生成碼。`infra` 對外只提供 `Load(dir)`：
內部以私有 `loader` 讀 `sheetdata/*.json` → `NewSheeter(...).FromData()` 組裝出 `*sheeter.Sheeter` 並回傳，核心直接吃這份生成的資料 port。

## 七、測試策略

統一用 **testify suite**（`Suite{Feature}` + `this` receiver），對齊 DiceBattle。

### 7.1 一律 in-memory builder（三層同一心智模型）

✅ **三層測試全部用 in-memory builder 直建資料**（不採 embedded fixture、不採 scenario/golden DSL）。
三層只差「建多少、跑多深」：

| 層 | 建什麼                                                    | 跑什麼                                           | 驗什麼             |
|:---|:----------------------------------------------------------|:-------------------------------------------------|:-------------------|
| L1 | 幾個 entity（builder）                                    | 直接戳子系統（exprs／command／selector／effect） | 單點行為           |
| L2 | entity + 初始容器                                         | 單一 phase／獨立流程（啟動技能／執行結算）       | 流程片段           |
| L3 | 完整資料 + 初始牌堆／排隊／前置技能 + scripted `Operator` | `games.Run` 跑到結算                             | 最終盤面／事件序列 |

理由：沒有重播需求、主要作者是工程／AI（非企劃），scenario 檔的好處用不到；單一做法心智負擔最低、type-safe、refactor 友善。

### 7.2 核心紀律：共用工廠，不共用實例

上一個專案用 `testdata/prefab*` 共用**建好的實例**，後期出現兩個病：①搞不清某筆資料為誰存在 ②一改壞一片。
根因是 tests 透過共用的**可變實例**互相耦合。對策——**去重去在「builder + 預設值」這層，不要去在「實例」這層**：

- builder 給一個**中性合法預設**（空白卡／普通顧客／無效果效果），test 只 inline 寫**它在乎的欄位**，其餘吃預設。
  - → 「為何存在」自明：被 set 的就是這 test 的重點，沒 set 的就是「不在乎」。
  - → 「改一個壞一片」消失：tests 各自 build、不共用可變實例，物理上互不影響。
  - → 去重沒丟：預設值吸收 boilerplate，重複量小且安全。
- **共用範圍越窄越好**：test-local ＞ 同檔／同 suite local ＞ 全專案。禁止再養全域 prefab 垃圾吸鐵；
  「一族相關 test 的共同基底」放在那個 test 檔／suite 內。
- builder **自動發唯一 ID**；test 用變數綁引用（`card := build.Card().Effect(effA)`），不手管全域 ID 表。
- 只共用「工廠／預設值／角色明確的填充料」（如 `build.FillerCard()`），不共用「帶劇情的實例」。

### 7.3 共用測試基建（放 `internal/tester` package）

✅ 已落地 `internal/tester`（取代原根層 `testdata/` 規劃）：跨包共用、只用 `cores` 公開介面；
`cores` 白箱測試不能 import `tester`（成環），自持私有複本。
**內容是工廠與替身，不是 prefab 實例庫**：

- `BuildSheet()`：迷你 in-memory 靜態表（座位／卡牌／效果／技能／抽獎／顧客）；各層測試共用同一份、只關注自己用到的列。
- `BuildData()`：包裝成 `cores.Data`（無命令編譯；自訂編譯效果以 `Data.SetEffect` 注入）。
- `FakeOperator`／`FakeRander`：決定性替身（Pick 取候選前綴、`Intn` 固定、`Shuffle` 恆等、`Weighted` 取首位）。

L3 基建（scripted `Operator` 輸入佇列、`recordPresenter()` 事件流錄製、`assemble(...)` 初始盤面組裝）隨 M14＋／M17 到站再補。
L3 若要廣域回歸，可**選擇性**對事件日誌做 golden 字串 snapshot（per-test 選項，非必備基建）。
單一 seeded `Rander` 確保 L3 決定性、assertion 穩定。

## 九、里程碑建議

與顯示規格書 §9 對齊，但核心優先：

細切為小、可獨立測的單位（每個約一個專注工作單位）。M0–M9 已被既有實作驗證、firm；M10 起標 *provisional*（效果／流程／TUI，到站再依當時設計細修）。

## 十、決策點

（目前無待拍板項；保留欄位供後續新議題。）

### 已敲定／已釐清

- ✅ **測試資料**：三層全用 in-memory builder；共用工廠不共用實例；基建放 `internal/tester`（BuildSheet／BuildData／FakeOperator／FakeRander；L3 件到站再補）。詳見第七節。
- ✅ **核心分包粒度（引擎本體 + 詞彙層 + 對外介面）**：拆 **`cores`（營業引擎本體＝資料模型 + 驅動引擎 `Game`）+ `rules`（命令語言詞彙層＝屬性讀寫／操作命令／命令對象／內建函式 + 效果流程）+ `games`（對外介面層＝`Parse`／`Validate`／`Run`）** 三 package，各依關注點分檔；`exprs` 第四包獨立（零遊戲依賴、可單獨測）。依賴壓成 `games → rules → cores → exprs` 一條直線、編譯期鎖死方向。價值＝讀 `games` 即知對外能做什麼、規則內容集中 `rules`（每詞條一個吃 `game *cores.Game` 的具名自由函式，只經 `cores` 公開面操作狀態）、引擎機制集中 `cores` 且永不反向依賴詞彙與對外層；`cores` 不隨詞條增長。詞彙經裝備制注入 `Game`（見「命令語言詞彙單一定義點」條）。（演進：模型 B → cores+games 兩包 → 本三包制。）
- ✅ **衍生索引歸屬**：award 聚合與效果命令預編譯等載入時衍生索引（未來 Seat 鄰桌）隨引擎本體歸 `cores`（`data.go` 的 `Data` 聚合，`NewData` 建一次快取；效果命令編譯經 `Compiler` 由 games 注入；data 私有欄只在 `data.go` 內觸碰，外部走 GetSheet／GetAward／GetEffect／SetEffect 四門）。
- ✅ **exprs 注入機制**：builtin 與屬性詞彙綁定同屬 `rules` 詞彙（map 字面值；name→行為），經 `rules.Register` 裝備進 `Game` 私有詞彙表；`Game` 委派實作 `Resolver`，求值期經 `Game.Env()` 把 `Resolver`（自身）＋`builtin` 組成 eval-time `Env` 帶入——詞彙表只裝純函式、零 run-state、裝備後唯讀,等同常數、不破壞決定性（『零全域可變狀態』針對 run-state、非常數查表）；`exprs` 自身不內建函式、保持 game-agnostic。
- ✅ **命令語言詞彙單一定義點＝`rules` 套件層 map 字面值 + `Game` 裝備制**：attr／attrRef（讀寫）／selector／command／builtin 名稱在 `rules` 各概念檔的 map 字面值 key 寫一次（每詞條一具名函式），`rules.Register(game)` 於建構後一次裝備進 `Game` 的七張私有詞彙表（`Register*`；裝備後唯讀、等同常數）；`Has*` 供 `games.Validate` 查名。三層分離 parse（games 純文法 `Parse`）／validate（games 查 rules 表）／execute（`Game` 分派＋rules 行為）。**不設 `Lexicon` struct**：詞彙固定（一款遊戲）、不需可注入；代價是失去可替換詞彙（測試／變體),本專案用不到。（取代原『cores 套件層全域詞彙表』：詞彙遷出 cores 使引擎機制與規則內容分包。）
- ✅ **package 命名複數**：`exprs`／`cores`／`games`／`rules` 維持複數——避免 `expr`／`game`／`core` 遮蔽常見區域變數；為 package 名對單數鐵則（針對識別碼）的刻意例外。
- ✅ **解耦模型**：**邊界介面 + 同步驅動**（非 step function）。需求已確認：營業中不存檔、不重播 → step function 的「暫停點可序列化」優勢用不到。
  - 直譯 營業規格書【十九、核心流程】【二十、獨立流程】巢狀流程；暫停＝阻塞呼叫 `Operator`；步進＝阻塞 `Presenter.Emit`；測試＝scripted `Operator`。
  - 接受的取捨：暫停狀態活在 call stack → **營業中無法序列化**（符合「不能存檔」）。**營業邊界**（開始前／結束後）call stack 空、runtime 是純資料，仍可整包序列化 → 未來「局與局之間存檔」不受影響。
  - 單一 seeded `Rander` 仍保留（供 golden 測試與重現 bug，與存檔／重播無關）。

- ✅ **狀態歸屬**：引擎持有 instance／容器（純可序列化資料）+ **單向事件投影**；前端不持有規則狀態第二份拷貝。不採「前端實作佇列」。詳見第四節之二。（保留 `Container[T]` seam 為未來備案，預設 in-core，目前不啟用。）
- ✅ **命令對象命名**：`selector`（檔名 `rules/selector.go`、識別碼 `Selector`／`selectorGuest`）。非保留字；語意比 `filter` 廣，且避開 `target`（目標類型）與 spec 既有「filter 規則」子術語的撞名。
- ✅ **目錄結構**：`cmd/{tui,check}`（瘦進入點）+ `app/{tui,check}`（應用本體）+ `internal/{infra,exprs,cores,rules,games,tester}`（`infra` 為 Go-only 基礎設施、`tester` 為跨包測試基建，`exprs`／`cores`／`rules`／`games` 為核心四包）。`cmd` 不會肥。
- ✅ **命令 vs 命令對象分檔**：rules 的 `command.go`（verb）與 `selector.go`（作用對象解析）拆開。
- ✅ **Award／Effect 資料**：已生成／已修正（見第八節）。
- ✅ **企劃輔助工具＝運算式／命令驗證器**：單筆輸入 + Effect 表掃描共用同一引擎；6 欄位中 4 個命令欄位是命令文法、需命令解析器（M5）。**地基（共用帶位置錯誤型別）入 M5 驗收；工具本體為 M5 後置、非 gating 的支線**（可與效果系統 M10 起並行），不先出只驗運算式的半套。原「帶參數求值 + 運算過程」工具不做。詳見【附錄：企劃驗證器】。

## 附錄：企劃驗證器

給**企劃（非工程）**在不跑遊戲下，檢查自己填的運算式／命令欄位有無語法錯誤的 Go-only 開發工具。是掛在命令解析（M5）後面的工具支線，非核心線里程碑（排程詳見第九節「工具支線」）。

**兩個工具＝同一引擎的兩種輸入模式**：

- **單筆檢查**：企劃貼一段內容、選欄位種類 → 回報帶位置的中文錯誤。
- **表單掃描**：掃 Effect 表的運算式／命令欄位 → 輸出 檔／列／欄 + 位置錯誤；可掛進 `task`／CI 與 `task lint` 並跑。

**6 欄位分兩種文法，依欄位分派驗證**（這是整套的關鍵約束）：

| 欄位                                            | 文法                                 | 驗證來源                           |
|:------------------------------------------------|:-------------------------------------|:-----------------------------------|
| 觸發條件 `TriggerCond`、觸發次數 `TriggerCount` | 運算式                               | `exprs.Parse`（已有）              |
| 立即／觸發／啟動／結束命令 `Command*`           | 命令（verb + 命令對象 + 內嵌運算式） | 命令解析器（M5，`games/parse.go`） |

**工程決策**：

- **地基入 M5、工具本體為 M5 後置支線**：4／6 欄位是命令文法，命令解析器正是 M5 的核心產出。M5 驗收即要求命令解析器重用共用錯誤型別、吐友善位置錯誤（地基）；工具本體（CLI＋掃描器＋`task`／CI）依賴 M5 完成，作為非 gating 支線、可與效果系統（M10 起）並行。不先出「只驗運算式」的半套——半套掃描會讓命令欄位默默跳過，企劃看到「全部通過」會誤判命令欄也驗過了，比沒有更糟。
- **錯誤對企劃友善**：帶位置（「第 N 字附近」）、中文白話、去工程術語。`exprs` 與命令解析器**共用同一「帶位置錯誤」型別**，兩種文法的錯誤格式一致。
- **放置**：文法／錯誤型別等能力在核心（`exprs`／`games`）；前端（CLI／REPL／掃描器）是 Go-only，掛 `cmd/` + `task`。
- **不做帶參數求值 + 運算過程**：輸入 UX 難規劃，企劃用 營業規格書 + AI 可達等效，暫不納入。

**錯誤地基（已完成）**：`exprs` 的 `token` 已帶位置欄位、lexer／parser 錯誤改吐「第 N 字附近」中文白話、去掉 `expr:` 內部前綴；並已立 `exprs.SyntaxError`（`Pos`＋`Msg`）作為 `exprs` 與未來命令解析器共用的帶位置錯誤型別。M5 命令解析器（`parse.go`）直接重用此型別；名稱合法性另由自由 `Validate` 查詞彙表 keys（M6 詞條到位後生效）。

<script>
(function () {
    // ----- 1) 渲染 markdown -----
    const src = document.getElementById('md-src').textContent.trim();
    const content = document.getElementById('content');
    content.innerHTML = marked.parse(src);

    // ----- 2) 為 h2 / h3 補錨點 id -----
    function slugify(text) {
        return text.trim()
            .replace(/\s+/g, '-')
            .replace(/[（）()\[\]【】，,。.、:：;；／/]/g, '')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '');
    }
    const heads = Array.prototype.slice.call(content.querySelectorAll('h2, h3'));
    const used = {};
    heads.forEach(function (h) {
        let id = slugify(h.textContent) || 'h';
        let finalId = id, i = 1;
        while (used[finalId] || document.getElementById(finalId)) {
            finalId = id + '-' + (++i);
        }
        used[finalId] = 1;
        h.id = finalId;
    });

    // ----- 3) 由標題生成左側目錄（沿用 .nav-group 樣式） -----
    const toc = document.getElementById('toc');
    const group = document.createElement('div');
    group.className = 'nav-group';
    const title = document.createElement('div');
    title.className = 'nav-group-title';
    title.textContent = '章節';
    group.appendChild(title);
    heads.forEach(function (h) {
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.setAttribute('data-target', h.id);
        a.textContent = h.textContent.trim();
        if (h.tagName === 'H3') {
            a.className = 'sub';
        } // if
        group.appendChild(a);
    });
    toc.appendChild(group);

    // ----- 4) scroll-spy：高亮當前章節 -----
    const links = Array.prototype.slice.call(toc.querySelectorAll('a'));
    const byId = {};
    links.forEach(function (a) { byId[a.getAttribute('data-target')] = a; });

    function onScroll() {
        let current = null, bestY = -Infinity;
        heads.forEach(function (h) {
            const y = h.getBoundingClientRect().top;
            if (y <= 120 && y > bestY) {
                bestY = y;
                current = h;
            } // if
        });
        links.forEach(function (a) { a.classList.remove('active'); });
        if (current && byId[current.id]) {
            byId[current.id].classList.add('active');
        } // if
    }
    document.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
})();
</script>
