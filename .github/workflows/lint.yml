name: lint

on:
  push:
    branches: [dev]
    paths:
      - "**/*.go"
  pull_request:
    branches: [dev]
    paths:
      - "**/*.go"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
